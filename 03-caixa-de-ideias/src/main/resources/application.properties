spring.application.name=caixa-de-ideias

# Endereço do banco local
spring.datasource.url=jdbc:postgresql://localhost:5432/caixa_de_ideias

# Usuário do PostgreSQL
spring.datasource.username=postgres

# Lê a senha de uma variável de ambiente
spring.datasource.password=${DB_PASSWORD}

# Atualiza a estrutura das tabelas a partir das entidades.
# Usaremos esta opção no banco local de estudos.
spring.jpa.hibernate.ddl-auto=update

# Exibe no terminal o SQL executado.
spring.jpa.show-sql=true