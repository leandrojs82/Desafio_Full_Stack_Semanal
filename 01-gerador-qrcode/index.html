<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Gerador de QR Code</h2>
        <p class="subtitle">Cole um URL ou introduza o seu texto para gerar o código QR</p>
        
        <form id="form-qrcode">
            <div class="input-group">
                <label for="texto">Introduza texto ou URL:</label>
                <input type="text" name="texto" id="texto" placeholder="https://exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="tamanho">Tamanho do QR Code:</label>
                <select id="tamanho">
                    <option value="128">Pequeno</option>
                    <option value="200" selected>Médio</option>
                    <option value="300">Grande</option>
                </select>
            </div>

            <button type="submit" id="botao">Gerar Código QR</button>
        </form>

        <div id="qrcode"></div>

        <button type="button" id="baixar-qrcode" disabled>
            Baixar QR Code
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js" defer></script>
</body>

</html>
